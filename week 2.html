<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-image: url("https://images.unsplash.com/photo-1523050854058-8df90110c9f1");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .form-container {
            width: 400px;
            margin: 60px auto;
            padding: 25px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0px 0px 15px black;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .top-image {
            display: block;
            margin: 0 auto 15px auto;
            width: 80px;
        }

        label {
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin: 6px 0 15px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .gender {
            width: auto;
        }

        button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(to right, #4CAF50, #2E8B57);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: linear-gradient(to right, #2E8B57, #4CAF50);
        }
    </style>
</head>

<body>

    <div class="form-container">

        <!-- Top Student Icon -->
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" class="top-image">

        <h2>Student Registration</h2>

        <form>

            <label>Full Name:</label>
            <input type="text" required>

            <label>Email:</label>
            <input type="email" required>

            <label>Phone:</label>
            <input type="tel" required>

            <label>Gender:</label><br>
            <input type="radio" name="gender" class="gender"> Male
            <input type="radio" name="gender" class="gender"> Female
            <br><br>

            <label>Course:</label>
            <select>
                <option>BCA</option>
                <option>BSc</option>
                <option>BCom</option>
                <option>BTech</option>
            </select>

            <label>Address:</label>
            <textarea rows="3"></textarea>

            <button type="submit">Register</button>

        </form>
    </div>

</body>
</html>
